<div id="search-page-container">
    <h1 style="color: var(--card-text-color-main); margin-bottom: 20px;">Search</h1>
    
    <input type="text" id="manual-search-input" placeholder="輸入關鍵字..." 
           style="width: 100%; padding: 15px; font-size: 18px; border-radius: 10px;">
    
    <div id="manual-search-results" style="margin-top: 30px;"></div>
</div>

<script>
    (function() {
        let isInitialLoad = true;

        const initSearch = () => {
            const input = document.getElementById('manual-search-input');
            const resultsContainer = document.getElementById('manual-search-results');
            
            if (!input || !resultsContainer) return;

            if (isInitialLoad) {
                const urlParams = new URLSearchParams(window.location.search);
                const keywordFromUrl = urlParams.get('keyword');
                
                if (keywordFromUrl) {
                    input.value = keywordFromUrl;
                    performSearch(keywordFromUrl, resultsContainer);
                }
                isInitialLoad = false;
            }

            if (!input.dataset.listenerBound) {
                input.addEventListener('input', () => {
                    performSearch(input.value.trim(), resultsContainer);
                });
                input.dataset.listenerBound = "true";
            }
        };

        function performSearch(query, container) {
            if (!query) {
                container.innerHTML = "";
                return;
            }
            fetch("/blog/index.json")
                .then(res => res.json())
                .then(data => {
                    const matched = data.filter(item => 
                        item.title.toLowerCase().includes(query.toLowerCase()) || 
                        (item.contents && item.contents.toLowerCase().includes(query.toLowerCase()))
                    );
                    
                    
                    container.innerHTML = matched.map(item => `
                        <a href="${item.permalink}" class="search-result-card">
                            <span class="search-result-title">${item.title}</span>
                            <div class="search-result-meta">
                                <span>📂 ${item.categories || '未分類'}</span>
                            </div>
                        </a>
                    `).join('');
                });
        }

        document.addEventListener('DOMContentLoaded', initSearch);
        const checker = setInterval(() => {
            initSearch();
            if (document.getElementById('manual-search-input') && !isInitialLoad) {
                clearInterval(checker);
            }
        }, 1000);
    })();
</script>
