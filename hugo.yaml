baseURL: https://annkuoq.github.io/blog/
languageCode: zh-tw
theme: hugo-theme-stack
title: AnnKuoQ Blog
copyright: AnnKuoQ

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-tw

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true


services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id:

pagination:
    pagerSize: 3

permalinks:
    post: /:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: img/favicon.ico

    footer:
        since: 2020
        customText:

    dateFormat:
        published: "2006-1-2"
        lastUpdated: "2006-1-2"

    sidebar:
#        emoji: 🍥
        subtitle: 擺放各種筆記的地方
        avatar:
            enabled: true
            local: false
            src: img/avatar.png

    article:
        math: false
        toc: true
        readingTime: false
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: utterances
        utterances:
            repo: https://github.com/annkuoQ/blog-utterances
            issueTerm: pathname
            label: 

    widgets:
        homepage:
#            - type: search
#            - type: archives
#              params:
#                  limit: 2
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: false

        # Available values: auto, light, dark
        default: dark

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

    customCSS:
        - scss/custom.scss
        
    search:
        enable: true

outputs:
    home:
        - HTML
        - RSS
        - JSON


### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:

    main:
#    social:
#        - identifier: github
#          name: GitHub
#          url: https://github.com/CaiJimmy/hugo-theme-stack
#          params:
#              icon: brand-github

        - identifier: home
          name: Home
          url: /
          weight: 1
          params:
              icon: home

        - identifier: about
          name: About
          url: /about/
          weight: 2
          params:
              icon: user

#        - identifier: search
#          name: 搜尋
#          url: /search/
#          weight: 3
#          params:
#              icon: search

        - identifier: archives
          name: Archives
          url: /archives/
          weight: 4
          params:
              icon: archives

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            hardWraps: true # 讓 Hugo 看到換行就直接轉成 <br>
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
