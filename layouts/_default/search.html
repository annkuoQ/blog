{{ define "main" }}
<section class="search-page-header">
    <form action="{{ .RelPermalink }}" method="GET" class="search-form widget">
        <p>
            <label>Search</label>
            {{/* 關鍵：name 改回 keyword，這樣才能觸發腳本 */}}
            <input name="keyword" id="search-input" placeholder="輸入關鍵字..." />
            <button title="Search" type="submit">
                <i class="icon-search"></i>
            </button>
        </p>
    </form>
</section>

{{/* 這是顯示結果的區塊，Stack 主題需要這些特定的 Class */}}
<section class="search-result">
    <h4 class="search-result--title section-title">Matching pages</h4>
    <div class="search-result--list article-list--compact" id="search-results"></div>
</section>

<script>
    // 這裡維持該教學成功的路徑對接
    window.searchConfig = {
        indexURL: "/blog/index.json"
    };
</script>

{{/* 載入你剛才設定成功的 JS 檔案 */}}
<script type="text/javascript" src="/blog/ts/search.js" defer></script>
{{ end }}
