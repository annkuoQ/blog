{{ define "main" }}
<form action="{{ .RelPermalink }}" method="GET" class="search-form widget">
    <p>
        <label>Search</label>
        <input name="keyword" placeholder="輸入關鍵字..." />
        <button title="Search">
            <i class="icon-search"></i>
        </button>
    </p>
</form>

<h4 class="search-result--title section-title"></h4>
<div class="search-result--list article-list--compact"></div>

<script>
    // 直接定義搜尋配置，確保 indexURL 指向正確的 JSON 位置
    window.searchConfig = {
        "indexURL": "/blog/index.json"
    };
</script>

{{/* 繼續使用手動載入的 JS */}}
<script type="text/javascript" src="/blog/ts/search.js" defer></script>
{{ end }}
