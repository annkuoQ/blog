{{ define "main" }}
<div id="search-page-container" style="padding: 20px; max-width: 800px; margin: 0 auto;">
    <h1 style="color: var(--card-text-color-main); margin-bottom: 20px;">Search</h1>
    
    <input type="text" id="manual-search-input" placeholder="輸入關鍵字..." 
           style="width: 100%; padding: 15px; font-size: 18px; border-radius: 10px; border: 2px solid var(--primary); background: #fff !important; color: #000 !important;">
    
    <div id="manual-search-results" style="margin-top: 30px;"></div>
</div>

<script>
    (function() {
        const initSearch = () => {
            const input = document.getElementById('manual-search-input');
            const resultsContainer = document.getElementById('manual-search-results');
            
            // 1. 處理搜尋頁面本體的邏輯
            if (input && resultsContainer) {
                // 如果網址有 keyword 參數，自動執行一次搜尋
                const urlParams = new URLSearchParams(window.location.search);
                const keyword = urlParams.get('keyword');
                if (keyword) {
                    input.value = keyword;
                    performSearch(keyword, resultsContainer);
                }

                input.addEventListener('input', () => {
                    performSearch(input.value.trim(), resultsContainer);
                });
            }

            // 2. 處理側欄搜尋框 (Sidebar) 的邏輯
            // 嘗試抓取側欄的輸入框或表單
            const sidebarInput = document.querySelector('.widget.search input') || document.querySelector('aside .search input');
            const sidebarForm = document.querySelector('.widget.search form') || document.querySelector('aside .search form');

            if (sidebarInput) {
                // 攔截鍵盤 Enter 事件
                sidebarInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const query = this.value.trim();
                        if (query) {
                            window.location.href = `/blog/search/?keyword=${encodeURIComponent(query)}`;
                        }
                    }
                });
            }

            // 如果側欄有 form，攔截其 submit 事件
            if (sidebarForm) {
                sidebarForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const q = sidebarForm.querySelector('input').value.trim();
                    if (q) {
                        window.location.href = `/blog/search/?keyword=${encodeURIComponent(q)}`;
                    }
                });
            }
        };

        // 核心搜尋邏輯
        function performSearch(query, container) {
            if (!query) {
                container.innerHTML = "";
                return;
            }
            fetch("/blog/index.json")
                .then(res => res.json())
                .then(data => {
                    const matched = data.filter(item => 
                        item.title.toLowerCase().includes(query.toLowerCase()) || 
                        (item.contents && item.contents.toLowerCase().includes(query.toLowerCase()))
                    );
                    container.innerHTML = matched.map(item => `
                        <div style="padding: 20px; margin-bottom: 15px; background: var(--card-background); border-radius: 12px; border: 1px solid var(--border-color);">
                            <a href="${item.permalink}" style="color: var(--primary); font-weight: bold; text-decoration: none; font-size: 1.2rem;">${item.title}</a>
                        </div>
                    `).join('');
                });
        }

        // 確保 SPA 與直接載入都能執行
        document.addEventListener('DOMContentLoaded', initSearch);
        const checker = setInterval(() => {
            initSearch();
            // 如果兩者都找到了，就停止檢查
            if (document.getElementById('manual-search-input') && document.querySelector('.widget.search input')) {
                clearInterval(checker);
            }
        }, 1000);
    })();
</script>
{{ end }}
